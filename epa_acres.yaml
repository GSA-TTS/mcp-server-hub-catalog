toolPreview:
  - name: get_epa_acres_properties_in_roi
    description: Query EPA ACRES for grantee-reported Brownfields property records within the ROI. Returns identifiable Brownfields properties (name, location, EPA region, FRS registry ID, ACRES property ID, coordinates, source URL) as a Markdown summary, grouped by state and paginated nearest-first. Note ACRES is not a complete inventory of brownfields or contaminated sites, and a record is not a determination that land is contaminated, available, or suitable for development.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
      max_results: "Maximum records in this response, valid range 1 to 100 (default 100) (optional)"
      result_offset: "Zero-based offset into records sorted nearest-first, valid range 0 to 9999 (default 0) (optional)"
