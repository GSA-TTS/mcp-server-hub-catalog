name: NEPA EPA ACRES
entryKey: obot-nepa-epa-acres
serverUserType: multiUser
shortDescription: Screen a location against EPA ACRES Brownfields property records for NEPA analysis and contaminated-site redevelopment research
description: |

  A Model Context Protocol (MCP) server for EPA's Assessment, Cleanup and
  Redevelopment Exchange System (ACRES), built for NEPA screening and
  contaminated-site redevelopment research. Given a latitude/longitude and a
  buffer radius, it identifies grantee-reported Brownfields properties within a
  region of interest (ROI), querying the public EPA Envirofacts facility-points
  ArcGIS service. No API key required.

  ## Features
  - **Brownfields property screening by ROI** — identifiable Brownfields
    properties reported to EPA's ACRES system through Brownfields grant
    programs, intersecting a buffered point.
  - **Nearest-first, paginated results** — properties returned nearest-first
    with per-state grouping and offset/limit pagination for large result sets.
  - **Rich property detail** — property name, location, EPA region, FRS registry
    ID, ACRES property ID, coordinates, and source URL.
  - **Markdown summary output** — a compact, decision-oriented summary rather
    than raw ArcGIS payloads.

  ## What you'll need to connect
  **No setup required** — the server queries the public EPA Envirofacts
  Brownfields ArcGIS service. No API key or authentication is needed.

  ## Conventions
  - All coordinates are WGS84 (EPSG:4326) decimal degrees. Convert addresses or
    place names to coordinates first.
  - `buffer_miles` accepts 0.1–100.0 (default 25).
  - `max_results` accepts 1–100 (default 100); `result_offset` accepts 0–9999
    (default 0) for nearest-first pagination.
  - **Scope note:** ACRES contains only properties reported through EPA
    Brownfields grant programs. It is not a complete inventory of brownfields or
    contaminated sites, and a record is not a determination that land is
    contaminated, available, or suitable for development.

  ## Examples
  - "What Brownfields properties are within 25 miles of 39.95, -75.16?"
  - "List EPA ACRES sites near latitude 42.36, longitude -71.06."
  - "Screen this location for reported Brownfields redevelopment sites."

