type: vmcp
entryKey: nepa-applications
displayName: NEPA Applications
description: |
  Screen project locations, research environmental resources, and analyze
  regulations with all tools from the 15 NEPA components in the GSA cloud.gov
  MCP gateway. Supports early NEPA research, not official determinations,
  consultation, or completed NEPA compliance. Pilot / proof of concept;
  not authorized for production use.
