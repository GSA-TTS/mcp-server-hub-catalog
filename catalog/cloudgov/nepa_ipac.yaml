name: NEPA IPaC Internal
entryKey: obot-nepa-ipac
serverUserType: multiUser
shortDescription: Internal cloud.gov component for USFWS trust-resource screening
description: |

  Administrative component for the NEPA IPaC MCP service deployed as an
  internal cloud.gov application. Users connect through the NEPA IPaC vMCP,
  not directly to this entry.

  The service screens a region of interest for USFWS trust resources, including
  ESA-listed species, migratory birds, wetlands, critical habitat, and National
  Wildlife Refuges. Results support early planning and screening; they do not
  replace an official IPaC species list, agency determination, or consultation.
  The public source requires no API key.

metadata:
  categories: Government, Geospatial, Environment, Wildlife
  allow-multiple: "false"
icon: https://raw.githubusercontent.com/GSA-TTS/mcp-server-hub-catalog/main/icons/ipac.png
repoURL: https://github.com/GSA-TTS/nepa-mcp
runtime: remote
remoteConfig:
  fixedURL: http://mcp-nepa-ipac.apps.internal:8080/mcp
toolPreview:
  - name: get_ipac_resources_in_roi
    description: Screen a region of interest for USFWS trust resources, including ESA-listed species, migratory birds, wetlands, critical habitat, and refuges. Results do not replace an official IPaC species list, agency determination, or consultation.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
