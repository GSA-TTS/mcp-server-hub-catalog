name: NEPA BLM Internal
entryKey: obot-nepa-blm
serverUserType: multiUser
shortDescription: Internal cloud.gov component for BLM environmental screening data
description: |

  Administrative component for the NEPA BLM MCP service deployed as an
  internal cloud.gov application. Users connect through the NEPA BLM vMCP,
  not directly to this entry.

  The service screens a region of interest against BLM approved land use plans,
  designated wilderness areas, and National Monuments / National Conservation
  Areas. It queries public BLM ArcGIS services and requires no API key.

metadata:
  categories: Government, Geospatial, Environment
  allow-multiple: "false"
icon: https://raw.githubusercontent.com/GSA-TTS/mcp-server-hub-catalog/main/icons/blm.png
repoURL: https://github.com/GSA-TTS/nepa-mcp
runtime: remote
remoteConfig:
  fixedURL: http://mcp-nepa-blm.apps.internal:8080/mcp
toolPreview:
  - name: get_blm_land_use_plans_in_roi
    description: Identify BLM approved land use plans intersecting the region of interest for conformance checks per 43 CFR 1610.5.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
  - name: get_blm_wilderness_areas_in_roi
    description: Identify BLM designated wilderness areas intersecting the region of interest for Extraordinary Circumstances screening.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
  - name: get_blm_national_monuments_in_roi
    description: Identify BLM National Monuments and National Conservation Areas intersecting the region of interest.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
