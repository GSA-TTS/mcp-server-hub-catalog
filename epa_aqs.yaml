name: NEPA EPA AQS
entryKey: obot-nepa-epa-aqs
serverUserType: singleUser
shortDescription: Assess air quality baseline conditions for NEPA analysis from EPA AQS criteria-pollutant monitoring data and NAAQS screening
description: |

  A Model Context Protocol (MCP) server for the U.S. Environmental Protection
  Agency Air Quality System (AQS), built for NEPA/EIS air quality baseline
  assessments. Given a latitude/longitude and a buffer radius, it identifies
  criteria-pollutant monitoring stations, retrieves annual air quality
  statistics, and screens observed values against selected National Ambient Air
  Quality Standards (NAAQS).

  ## Features
  - **Discover monitoring stations** — locate EPA air quality monitors in a
    region of interest (ROI), with operational dates and measured pollutants.
  - **Annual statistics** — annual means and maximums for criteria pollutants
    (PM2.5, PM10, Ozone, NO2, SO2, CO), with screening comparisons against
    selected NAAQS values.
  - **One-shot baseline analysis** — combine monitor discovery with annual
    statistics and NAAQS screening into a single comprehensive report.

  ## What you'll need to connect
  A **free personal EPA AQS registration** — an email and API key from
  https://aqs.epa.gov/data/api/signup. Because this is a per-user
  (`singleUser`) server, you will be prompted for your own email and key when
  you enable the server; they are stored securely and used only by your own
  isolated instance.

  ## Conventions
  - All coordinates are WGS84 (EPSG:4326) decimal degrees. Convert addresses or
    place names to coordinates first.
  - `buffer_miles` accepts 0.1–100.0 (default 25).
  - Default pollutants: PM2.5, PM10, Ozone, NO2, SO2, CO.

  ## Examples
  - "What air quality monitors are within 25 miles of 34.05, -118.24?"
  - "Get annual PM2.5 and Ozone statistics near latitude 39.7, longitude -104.9 for 2020-2022."
  - "Run an air quality baseline analysis for this site with NAAQS screening."

metadata:
  categories: Government, Geospatial, Environment, Air Quality
  allow-multiple: "false"
icon: https://raw.githubusercontent.com/GSA-TTS/mcp-server-hub-catalog/main/icons/epa_aqs.png
repoURL: https://github.com/GSA-TTS/nepa-mcp
env:
  - key: EPA_AQS_EMAIL
    name: EPA AQS Email
    description: The email address registered with EPA AQS (free at https://aqs.epa.gov/data/api/signup)
    required: true
    sensitive: false
  - key: EPA_AQS_API_KEY
    name: EPA AQS API Key
    description: Your personal EPA AQS API key (free at https://aqs.epa.gov/data/api/signup)
    required: true
    sensitive: true
runtime: containerized
containerizedConfig:
  image: ghcr.io/gsa-tts/mcp-server-nepa-epa-aqs:0.1.0
  port: 8080
  path: /mcp
  healthzPath: /health
toolPreview:
  - name: get_epa_aqs_air_quality_monitors
    description: Identify EPA air quality monitoring stations within a region of interest. Returns monitor locations, operational dates, and measured pollutants as a Markdown summary — useful for identifying available data sources for a NEPA baseline assessment.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
      year: "Year to query for active monitors (default current year) (optional)"
      pollutants: "Pollutants to query from {PM2.5, PM10, Ozone, NO2, SO2, CO} (default all) (optional)"
  - name: get_epa_aqs_annual_air_quality
    description: Get annual air quality statistics for criteria pollutants in a region — annual means, maximums, and screening comparisons against selected NAAQS values — without also retrieving monitor metadata.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
      begin_year: "First year to query (default last year) (optional)"
      end_year: "Last year to query (default last year) (optional)"
      pollutants: "Pollutants to query from {PM2.5, PM10, Ozone, NO2, SO2, CO} (default all) (optional)"
  - name: analyze_epa_aqs_air_quality_baseline
    description: One-shot air quality baseline analysis for NEPA screening — combines monitor discovery with annual AQS statistics and compares observed annual metrics to selected NAAQS values in a single comprehensive report.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
      begin_year: "First year for the baseline period (default last year) (optional)"
      end_year: "Last year for the baseline period (default last year) (optional)"
      pollutants: "Pollutants to analyze from {PM2.5, PM10, Ozone, NO2, SO2, CO} (default all) (optional)"
