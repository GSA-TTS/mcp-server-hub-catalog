toolPreview:
  - name: get_efh_hapc
    description: Query NOAA for Habitat Areas of Particular Concern (HAPC) within the ROI. Returns HAPC designations — high-priority EFH subsets that warrant heightened scrutiny under the Magnuson-Stevens Act — as a Markdown summary. Coverage is NOAA Fisheries West Coast Region.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
  - name: get_efh_areas
    description: Query NOAA for general Essential Fish Habitat (EFH) areas within the ROI — waters and substrate necessary for fish spawning, breeding, feeding, or growth to maturity under the Magnuson-Stevens Act. Returns a Markdown summary. Coverage is NOAA Fisheries West Coast Region.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
  - name: get_efh_salmon
    description: Query NOAA for salmon Essential Fish Habitat by HUC-8 watershed within the ROI. Returns watersheds designated as EFH for Chinook, Coho, and Pink salmon, identifying which species apply per watershed, as a Markdown summary. Coverage is NOAA Fisheries West Coast Region.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
  - name: get_efh_hms_cps_groundfish
    description: Query NOAA for Highly Migratory Species (HMS), Coastal Pelagic Species (CPS), and Pacific Coast Groundfish EFH within the ROI. Returns a Markdown summary with acreage unioned by designation and clipped to the ROI. Coverage is NOAA Fisheries West Coast Region.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
