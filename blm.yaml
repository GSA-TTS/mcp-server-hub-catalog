  port: 8080
  path: /mcp
  healthzPath: /health
toolPreview:
  - name: get_blm_land_use_plans_in_roi
    description: Identify BLM approved land use plans (RMPs/MFPs) intersecting the region of interest. Returns a Markdown summary with plan name, status, ROD date, admin state, and ePlanning links for conformance checks per 43 CFR 1610.5.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
  - name: get_blm_wilderness_areas_in_roi
    description: Identify BLM designated wilderness areas (protected under the Wilderness Act of 1964) intersecting the region of interest. Returns a Markdown summary with name, NLCS ID, designation date, and area. Supports Extraordinary Circumstances screening.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
  - name: get_blm_national_monuments_in_roi
    description: Identify BLM National Monuments and National Conservation Areas (NCAs) intersecting the region of interest. Returns a Markdown summary with name, NLCS ID, admin state, and area — special designations that carry management restrictions.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
