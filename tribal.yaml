name: NEPA Tribal Lands
entryKey: obot-nepa-tribal
serverUserType: multiUser
shortDescription: Identify tribal lands (Census TIGERweb AIANNHA) intersecting a location for geographic context in NEPA analysis
description: |

  A Model Context Protocol (MCP) server for tribal-land geographic context,
  built for NEPA early-coordination and project-area review. Given a
  latitude/longitude and a buffer radius, it identifies American Indian /
  Alaska Native / Native Hawaiian Areas (AIANNHA) that intersect a region of
  interest (ROI), querying the public U.S. Census Bureau TIGERweb service. No
  API key required.

  ## Features
  - **Tribal-land geographic context by ROI** — AIANNHA areas intersecting a
    buffered point, for early coordination and project-area review.
  - **Markdown summary output** — a compact, decision-oriented summary rather
    than raw ArcGIS payloads.

  ## Scope and limitations
  This server returns the Census TIGERweb AIANNHA **cartographic boundary**
  layer. It provides *geographic context* for a project area — it is not the
  authoritative basis for government-to-government tribal consultation, and a
  no-hit result does not establish the absence of tribal interests. Use it to
  orient early coordination, not to satisfy a consultation obligation.

  ## What you'll need to connect
  **No setup required** — the server queries the public Census TIGERweb AIANNHA
  ArcGIS service. No API key or authentication is needed.

  ## Conventions
  - All coordinates are WGS84 (EPSG:4326) decimal degrees. Convert addresses or
    place names to coordinates first.
  - `buffer_miles` accepts 0.1–100.0 (default 25).

  ## Examples
  - "What tribal lands are within 25 miles of 35.68, -105.94?"
  - "Are there any AIANNHA areas near latitude 43.6, longitude -102.5?"
  - "Screen this site for tribal-land geographic context."

metadata:
  categories: Government, Geospatial, Demographics
  allow-multiple: "false"
icon: https://raw.githubusercontent.com/GSA-TTS/mcp-server-hub-catalog/main/icons/tribal.png
