  port: 8080
  path: /mcp
  healthzPath: /health
toolPreview:
  - name: get_tribal_lands_in_roi
    description: Identify tribal lands (American Indian / Alaska Native / Native Hawaiian Areas) intersecting the ROI using Census TIGERweb AIANNHA datasets. Returns a Markdown summary. This is a cartographic boundary layer providing geographic context — not the authoritative basis for government-to-government consultation.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
