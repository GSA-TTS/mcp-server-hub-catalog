toolPreview:
  - name: get_noaa_critical_habitat_in_roi
    description: Query NOAA for West Coast Region ESA-designated critical habitat within the ROI. Returns designated critical habitat (lines and polygons) for NOAA-managed species — salmon, steelhead, marine mammals, and marine fish — as a Markdown summary. Polygon area is unioned across diced fragments and clipped to the ROI. Coverage is NOAA Fisheries West Coast Region.
