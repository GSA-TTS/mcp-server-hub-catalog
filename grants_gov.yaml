name: Grants.gov
entryKey: obot-grants-gov
serverUserType: multiUser
shortDescription: Search and retrieve federal grant opportunities from Grants.gov
description: |

  A Model Context Protocol (MCP) server for [Grants.gov](https://www.grants.gov/),
  the U.S. government's central repository for federal grant opportunities. Search
  across all federal agencies and retrieve full opportunity details — no API key
  required.

  ## Features
  - **Search federal grant opportunities** by keyword, agency, status, eligibility type,
    and funding category
  - **Filter by opportunity status** — forecasted, posted, closed, or archived
  - **Look up by opportunity number** for exact matches
  - **Retrieve full opportunity details** including award amounts, eligibility, funding
    instruments, activity categories, ALN numbers, and contact information
  - **Paginate large result sets** with configurable page size (up to 100 per page)
  - **Return results as Markdown or JSON** for flexible downstream processing

  ## What you'll need to connect
  **No setup required** — the server queries the public Grants.gov API. No API key
  or authentication is needed.

  ## Examples
  - "Find open HHS grants related to maternal health"
  - "Show me all posted NSF education grants"
  - "What grants are available for small businesses in rural areas?"
  - "Get full details for opportunity HHS-2024-ACF-OCC-0181"
  - "List forecasted NIH grants in the health category"

metadata:
  categories: Government, Research, Health, Finance
  allow-multiple: "false"
icon: https://raw.githubusercontent.com/GSA-TTS/mcp-server-hub-catalog/main/icons/grants_gov.png
repoURL: https://github.com/HHS/mcp-server-grants-gov
runtime: containerized
containerizedConfig:
  image: ghcr.io/gsa-tts/mcp-server-grants-gov:0.1.0
  port: 8080
  path: /mcp
  healthzPath: /health
toolPreview:
  - name: grants_gov_search_opportunities
    description: Search for federal grant opportunities on Grants.gov. Supports full-text keyword search and filtering by agency, status, eligibility, and funding category. Returns paginated results.
    params:
      keyword: "Full-text search across opportunity titles and descriptions (optional)"
      opp_num: "Exact opportunity number lookup, e.g. 'HHS-2024-ACF-OCC-0181' (optional)"
      agencies: "Agency code filters, e.g. ['HHS', 'NSF', 'DOE'] (optional)"
      opp_statuses: "Status filters: 'forecasted', 'posted', 'closed', 'archived' (optional)"
      eligibilities: "Eligibility code filters (optional)"
      funding_categories: "Funding category code filters, e.g. ['ED', 'HL'] (optional)"
      aln: "Assistance Listing Number filter, e.g. '93.268' (optional)"
      rows: "Results per page, 1–100 (default: 25)"
      start_record: "1-indexed pagination offset (default: 1)"
      response_format: "'markdown' or 'json' (default: 'markdown')"
  - name: grants_gov_fetch_opportunity
    description: Fetch full details for a single grant opportunity by its numeric ID. Includes synopsis, eligibility, award amounts, contact info, funding instruments, activity categories, ALNs, and attachments. Use grants_gov_search_opportunities first to find IDs.
    params:
      opportunity_id: "Numeric opportunity ID, e.g. 289999"
      response_format: "'markdown' or 'json' (default: 'markdown')"
