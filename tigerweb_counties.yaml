runtime: containerized
containerizedConfig:
  image: ghcr.io/gsa-tts/mcp-server-nepa-tigerweb-counties:0.1.0
  port: 8080
  path: /mcp
  healthzPath: /health
toolPreview:
  - name: get_tigerweb_counties_in_roi
    description: Identify all counties intersecting an ROI buffer using Census TIGERweb. Returns county names and FIPS identifiers as a Markdown summary — useful for jurisdictional coordination and permitting. This is a boundary/geometry lookup, not socioeconomic statistics.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
