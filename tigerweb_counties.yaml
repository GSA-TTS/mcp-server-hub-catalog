name: NEPA Counties (TIGERweb)
entryKey: obot-nepa-tigerweb-counties
serverUserType: multiUser
shortDescription: Identify the counties intersecting a location (Census TIGERweb) for jurisdictional coordination in NEPA analysis
description: |

  A Model Context Protocol (MCP) server for county discovery, built for
  jurisdictional coordination and permitting analysis in NEPA reviews. Given a
  latitude/longitude and a buffer radius, it identifies every county that
  intersects a region of interest (ROI), querying the public U.S. Census Bureau
  TIGERweb service. No API key required.

  This is a **boundary/geometry** lookup ("which counties overlap this area?").
  For county-level socioeconomic statistics (income, poverty, employment), use
  the separate Census (ACS) server.

  ## Features
  - **County discovery by ROI** — all counties intersecting a buffered point,
    with names and FIPS identifiers, for jurisdictional coordination and
    permitting.
  - **Markdown summary output** — a compact, decision-oriented summary rather
    than raw ArcGIS payloads.

  ## What you'll need to connect
  **No setup required** — the server queries the public Census TIGERweb ArcGIS
  service. No API key or authentication is needed.

  ## Conventions
  - All coordinates are WGS84 (EPSG:4326) decimal degrees. Convert addresses or
    place names to coordinates first.
  - `buffer_miles` accepts 0.1–100.0 (default 25).

  ## Examples
  - "What counties are within 25 miles of 39.06, -108.55?"
  - "Which counties intersect a 10-mile buffer around latitude 34.05, longitude -118.24?"
  - "List the counties for this project area for jurisdictional coordination."

metadata:
  categories: Government, Geospatial, Demographics
  allow-multiple: "false"
icon: https://raw.githubusercontent.com/GSA-TTS/mcp-server-hub-catalog/main/icons/tigerweb_counties.png
