    description: Query NOAA for ESA-listed species ranges within the ROI. Returns ESA-listed salmon and steelhead range records from the NOAA Fisheries West Coast Region, broken down by HUC-12 watershed, as a Markdown summary. Watershed polygons are unioned by range record and clipped to the ROI. Coverage is NOAA Fisheries West Coast Region.
