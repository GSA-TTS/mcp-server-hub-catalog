toolPreview:
  - name: get_padus_protected_areas_in_roi
    description: Query the USGS PAD-US database for protected-area records within the ROI. Returns protected-area designations and managing organizations as a Markdown summary. Note PAD-US is a protected-areas database, not a cadastral parcel or comprehensive land-ownership service.
    params:
