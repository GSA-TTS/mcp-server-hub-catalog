toolPreview:
  - name: get_padus_protected_areas_in_roi
    description: Query the USGS PAD-US Combined layer for protected-area records (ownership, management, and designations) within the ROI. Returns designations and managing organizations as a Markdown summary, with a by-category breakdown. Note PAD-US is a protected-areas database, not a cadastral parcel or comprehensive land-ownership service, and source-feature acreage is not additive within the ROI.
    params:
      latitude: "Latitude in decimal degrees (WGS84), valid range -90 to 90."
      longitude: "Longitude in decimal degrees (WGS84), valid range -180 to 180."
      buffer_miles: "Buffer distance in miles, valid range 0.1 to 100.0 (default 25) (optional)"
