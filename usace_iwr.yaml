  healthzPath: /health
toolPreview:
  - name: usace_rivermile_nearest
    description: Return the single closest river mile marker to a WGS84 coordinate, with great-circle distance and compass bearing. Answers "what river mile am I at?".
    params:
      lat: "Latitude in decimal degrees (WGS84)."
      lon: "Longitude in decimal degrees (WGS84)."
      max_radius_meters: "Maximum search radius in meters. If no marker is found within this radius, none is reported. Default 50000 (50 km)."
  - name: usace_rivermile_find_markers
    description: Find river mile markers near a point (lat/lon + radius) or within a GeoJSON geometry/bbox. Point queries include distance and are sorted nearest-first.
    params:
      lat: "Latitude in decimal degrees (WGS84). Use with 'lon' for a proximity search; omit when supplying 'geometry'."
      lon: "Longitude in decimal degrees (WGS84). Use with 'lat' for a proximity search; omit when supplying 'geometry'."
      radius_meters: "Search radius in meters around the lat/lon point. Ignored when 'geometry' is supplied. Default 5000 (5 km)."
      geometry: "GeoJSON geometry object as a JSON string (Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon, or BoundingBox shorthand). Supply either this OR lat+lon."
      limit: "Maximum number of markers to return. Default 25."
  - name: usace_rivermile_query
    description: Filter markers by river name (case-insensitive substring) and/or a river-mile value range, ordered by mile ascending, with offset-based pagination.
    params:
      river_name: "River name to filter on (case-insensitive substring match, e.g. 'RED', 'MISSISSIPPI', 'OHIO'). Omit to match all rivers."
      mile_min: "Minimum river mile value (inclusive). Omit for no lower bound."
      mile_max: "Maximum river mile value (inclusive). Omit for no upper bound."
      limit: "Maximum markers to return per page. Default 25."
      offset: "Number of matching markers to skip (for pagination). Default 0."
